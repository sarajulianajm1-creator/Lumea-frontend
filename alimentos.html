</head>
<body>
    <!-- Barra de Navegación Global -->
<header>
        <div class="container fixed-bottom d-flex justify-content-center mb-4">
        <nav class="custom-navbar d-flex align-items-center justify-content-around px-3 py-2 shadow-lg">
            
            <!-- Elemento 1: Inicio -->

                <i class="bi bi-house-door-fill fs-4"></i>
                <span>Inicio</span>
            </a>

            <!-- Elemento 2: Ejercicios -->
            <a href="alimentos.html" class="nav-item-custom text-center text-decoration-none">
                <i class="bi bi-image-fill"></i>
                <span>Alimentos</span>
            </a>

            
            <a href="#" class="nav-item-custom text-center text-decoration-none ">
                <i class="bi bi-emoji-smile-fill"></i>
                <span>Emociones</span>
            </a>

            <!-- Elemento 4: Diario -->
            <a href="#" class="nav-item-custom text-center text-decoration-none">
                <i class="bi bi-calendar-check fs-4"></i>
                <span>Experiencia</span>

            <!-- Elemento 5: Mío -->

                <i class="bi bi-person-fill fs-4"></i>
                <span>Avatar</span>

        </nav>
        </div>
        
    
    <div class="lumea-dashboard-screen">
  
  <div class="lumea-dashboard-card">
    
    <!-- Título de la sección -->
    <div class="card-section-title">
      <span>1. MUÉSTRALE TU PLATO</span>
    </div>

    <!-- Visor de la Cámara -->
    <div class="camera-preview-container">
      <video id="webcam" autoplay playsinline class="camera-video-stream"></video>
      
      <!-- Esquinas decorativas de enfoque -->
      <div class="corner top-left"></div>
      <div class="corner top-right"></div>
      <div class="corner bottom-left"></div>
      <div class="corner bottom-right"></div>
    </div>

    <!-- Botones principales de acción -->
    <div class="camera-actions-main">
      <button id="btn-encender" class="lumea-btn-secondary">
        <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        Encender cámara
      </button>
      <button id="btn-tomar" class="lumea-btn-primary">
        <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
        Tomar foto (espacio)
      </button>
    </div>

    <!-- Botones secundarios de control -->
    <div class="camera-actions-sub">
      <button id="btn-otra" class="lumea-btn-pill">
        <svg class="pill-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Otra foto
      </button>
      <button id="btn-apagar" class="lumea-btn-pill">
        <svg class="pill-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>
        Apagar
      </button>
      <button id="btn-subir" class="lumea-btn-pill">
        <svg class="pill-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Subir foto
      </button>
    </div>

    <!-- Criterios inferiores preparados para recibir datos del backend -->
    <div class="criterios-grid-nuevos">
      
      <!-- 1. Sellos de advertencia -->
      <div class="criterio-card">
        <div class="criterio-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </div>
        <div class="criterio-title">Sellos</div>
        <div id="backend-sellos" class="criterio-desc">Esperando análisis...</div>
      </div>

      <!-- 2. Energía -->
      <div class="criterio-card">
        <div class="criterio-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </div>
        <div class="criterio-title">Energía</div>
        <div id="backend-energia" class="criterio-desc">-- kcal</div>
      </div>

      <!-- 3. Precisión -->
      <div class="criterio-card highlight">
        <div class="criterio-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        </div>
        <div class="criterio-title">Precisión IA</div>
        <div id="backend-precision" class="criterio-desc">--% seguridad</div>
      </div>

    </div>

  </div>
</div>
