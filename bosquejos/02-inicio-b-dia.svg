, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><rect x="56" y="884" width="358" height="68" rx="34" fill="#5F656B" stroke="#5F656B" stroke-width="1.5"/><circle cx="92" cy="908" r="9" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="92" y="936" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Inicio</text><circle cx="160" cy="908" r="9" fill="#9AA0A6" stroke="none" stroke-width="1.5"/><text x="160" y="936" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">Mis comidas</text><circle cx="310" cy="908" r="9" fill="#9AA0A6" stroke="none" stroke-width="1.5"/><text x="310" y="936" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">Progreso</text><circle cx="378" cy="908" r="9" fill="#9AA0A6" stroke="none" stroke-width="1.5"/><text x="378" y="936" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">Avatar</text><circle cx="235" cy="890" r="34" fill="#FFFFFF" stroke="#5F656B" stroke-width="3"/><text x="235" y="895" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#2B2F33" text-anchor="middle">Cámara</text><text x="470" y="160" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B2F33" text-anchor="start">Qué hace cada parte</text><circle cx="483" cy="191" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="483" y="196" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="506" y="196" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">Nivel y racha arriba, siempre visibles.</text><circle cx="483" cy="228" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="483" y="233" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="506" y="233" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">La meta del día en una barra. Debe decir</text><text x="506" y="254" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">el número además de la barra.</text><circle cx="483" cy="286" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="483" y="291" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="506" y="291" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">Los momentos del día. Los vacíos invitan a</text><text x="506" y="312" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">registrar. Ojo: el backend no guarda si</text><text x="506" y="333" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">fue desayuno o almuerzo; habría que</text><text x="506" y="354" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">deducirlo de la hora.</text><circle cx="483" cy="386" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="483" y="391" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="506" y="391" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">Wow: la misión cumplida se voltea y</text><text x="506" y="412" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">aparece su calcomanía.</text><circle cx="483" cy="444" r="4" fill="#6B7177" stroke="#6B7177" stroke-width="1.5"/><text x="506" y="449" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">A es más juguetona y visual; B es más</text><text x="506" y="470" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">clara para crear rutina. ¿Cuál se parece</text><text x="506" y="491" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">más a 'divertido y fluido'? También puedes</text><text x="506" y="512" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">combinarlas.</text></svg>