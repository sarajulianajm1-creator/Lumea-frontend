<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1010" width="900" height="1010" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="900" height="1010" fill="#F7F7F5"/><text x="40" y="50" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#2B2F33" text-anchor="start">Registrar comida</text><text x="40" y="80" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#6B7177" text-anchor="start">Variante B · La IA tiene dudas</text><text x="40" y="104" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7177" text-anchor="start">Ya existe en código (ejemplo-camara.html); aquí se piensa el celular.</text><rect x="40" y="140" width="390" height="844" rx="46" fill="#FFFFFF" stroke="#8E949A" stroke-width="2.5"/><text x="70" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6B7177" text-anchor="start">9:41</text><rect x="185" y="152" width="100" height="28" rx="14" fill="#8E949A" stroke="#8E949A" stroke-width="1.5"/><text x="64" y="226" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2B2F33" text-anchor="start">Registrar comida</text><rect x="56" y="244" width="358" height="300" rx="28" fill="#5F656B" stroke="#5F656B" stroke-width="1.5"/><text x="235" y="400" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle">Visor de la cámara</text><circle cx="412" cy="244" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="412" y="249" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><rect x="48" y="570" width="374" height="300" rx="30" fill="#FFFFFF" stroke="#8E949A" stroke-width="2"/><circle cx="80" cy="606" r="8" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><line x1="102" y1="586" x2="102" y2="854" stroke="#B9BEC4" stroke-width="1.5" stroke-dasharray="5 5"/><text x="120" y="610" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B2F33" text-anchor="start">?  Tengo dudas con esta foto.</text><text x="120" y="632" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7177" text-anchor="start">¿Me ayudas a confirmarla?</text><rect x="120" y="652" width="280" height="48" rx="14" fill="#FFFFFF" stroke="#B9BEC4" stroke-width="1.5"/><text x="138" y="682" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B2F33" text-anchor="start">Ajiaco</text><rect x="120" y="710" width="280" height="48" rx="14" fill="#FFFFFF" stroke="#B9BEC4" stroke-width="1.5"/><text x="138" y="740" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B2F33" text-anchor="start">Sancocho</text><rect x="120" y="768" width="280" height="48" rx="14" fill="#FFFFFF" stroke="#B9BEC4" stroke-width="1.5"/><text x="138" y="798" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B2F33" text-anchor="start">Mondongo</text><text x="120" y="840" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7177" text-anchor="start">Ninguno, lo escribo yo</text><circle cx="412" cy="652" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="412" y="657" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="470" y="160" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B2F33" text-anchor="start">Qué hace cada parte</text><circle cx="483" cy="191" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="483" y="196" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="506" y="196" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">Cuando la IA duda, no adivina: ofrece</text><text x="506" y="217" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">opciones como botones. Pide ayuda, no</text><text x="506" y="238" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">alarma (color mango + signo de pregunta).</text><circle cx="483" cy="270" r="4" fill="#6B7177" stroke="#6B7177" stroke-width="1.5"/><text x="506" y="275" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">Hoy el backend ya manda opciones para los</text><text x="506" y="296" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">grupos que se confunden (sopas,</text><text x="506" y="317" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">dulces...). Mostrar el top-3 general en</text><text x="506" y="338" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">cualquier foto es un cambio pequeño en</text><text x="506" y="359" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">/predecir: en la prueba de campo la</text><text x="506" y="380" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">respuesta correcta estuvo en el top-3 en</text><text x="506" y="401" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">13 de 13 fotos.</text><circle cx="483" cy="433" r="4" fill="#6B7177" stroke="#6B7177" stroke-width="1.5"/><text x="506" y="438" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">'Ninguno, lo escribo yo' abre un buscador</text><text x="506" y="459" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">sobre GET /alimentos.</text><rect x="56" y="884" width="358" height="68" rx="34" fill="#5F656B" stroke="#5F656B" stroke-width="1.5"/><circle cx="92" cy="908" r="9" fill="#9AA0A6" stroke="none" stroke-width="1.5"/><text x="92" y="936" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">Inicio</text><circle cx="160" cy="908" r="9" fill="#9AA0A6" stroke="none" stroke-width="1.5"/><text x="160" y="936" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">Mis comidas</text><circle cx="310" cy="908" r="9" fill="#9AA0A6" stroke="none" stroke-width="1.5"/><text x="310" y="936" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">Progreso</text><circle cx="378" cy="908" r="9" fill="#9AA0A6" stroke="none" stroke-width="1.5"/><text x="378" y="936" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">Avatar</text><circle cx="235" cy="890" r="34" fill="#FFFFFF" stroke="#5F656B" stroke-width="3"/><text x="235" y="895" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#2B2F33" text-anchor="middle">Cámara</text></svg>