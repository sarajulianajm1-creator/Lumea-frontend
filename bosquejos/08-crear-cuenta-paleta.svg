>Puedes cambiarla cuando quieras.</text><rect x="64" y="312" width="342" height="72" rx="18" fill="#ECEEF0" stroke="#5F656B" stroke-width="2.5"/><text x="84" y="344" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B2F33" text-anchor="start">Laguna Verde</text><circle cx="92" cy="364" r="9" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><circle cx="118" cy="364" r="9" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><circle cx="144" cy="364" r="9" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><circle cx="170" cy="364" r="9" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><circle cx="196" cy="364" r="9" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><rect x="64" y="396" width="342" height="72" rx="18" fill="#FFFFFF" stroke="#B9BEC4" stroke-width="1.5"/><text x="84" y="428" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B2F33" text-anchor="start">Neblina</text><circle cx="92" cy="448" r="9" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><circle cx="118" cy="448" r="9" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><circle cx="144" cy="448" r="9" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><circle cx="170" cy="448" r="9" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><circle cx="196" cy="448" r="9" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><rect x="64" y="480" width="342" height="72" rx="18" fill="#FFFFFF" stroke="#B9BEC4" stroke-width="1.5"/><text x="84" y="512" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B2F33" text-anchor="start">Carnaval</text><circle cx="92" cy="532" r="9" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><circle cx="118" cy="532" r="9" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><circle cx="144" cy="532" r="9" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><circle cx="170" cy="532" r="9" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><circle cx="196" cy="532" r="9" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><rect x="64" y="564" width="342" height="72" rx="18" fill="#FFFFFF" stroke="#B9BEC4" stroke-width="1.5"/><text x="84" y="596" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B2F33" text-anchor="start">Colibrí</text><circle cx="92" cy="616" r="9" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><circle cx="118" cy="616" r="9" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><circle cx="144" cy="616" r="9" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><circle cx="170" cy="616" r="9" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><circle cx="196" cy="616" r="9" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><rect x="64" y="648" width="342" height="72" rx="18" fill="#FFFFFF" stroke="#B9BEC4" stroke-width="1.5"/><text x="84" y="680" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B2F33" text-anchor="start">Cosecha</text><circle cx="92" cy="700" r="9" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><circle cx="118" cy="700" r="9" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><circle cx="144" cy="700" r="9" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><circle cx="170" cy="700" r="9" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><circle cx="196" cy="700" r="9" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><rect x="58" y="306" width="354" height="420" rx="18" fill="none" stroke="#E0A100" stroke-width="2.5" stroke-dasharray="7 5"/><rect x="362" y="294" width="50" height="22" rx="11" fill="#E0A100" stroke="#E0A100" stroke-width="1.5"/><text x="387" y="309" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Wow</text><circle cx="70" cy="308" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="70" y="313" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><rect x="64" y="780" width="342" height="48" rx="24.0" fill="#5F656B" stroke="#5F656B" stroke-width="1.5"/><text x="235.0" y="809.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Seguir</text><text x="470" y="160" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B2F33" text-anchor="start">Qué hace cada parte</text><circle cx="483" cy="191" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="483" y="196" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="506" y="196" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">Cuatro pasos: 1 tu nombre y correo, 2 tu</text><text x="506" y="217" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">objetivo (las cinco tarjetas de Sara), 3</text><text x="506" y="238" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">tu paleta, 4 tu contraseña.</text><circle cx="483" cy="270" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="483" y="275" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="506" y="275" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">Wow: al tocar una paleta, TODA la pantalla</text><text x="506" y="296" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">cambia a esos colores al instante. Es el</text><text x="506" y="317" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">primer momento de autonomía en la app.</text><circle cx="483" cy="349" r="4" fill="#6B7177" stroke="#6B7177" stroke-width="1.5"/><text x="506" y="354" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">Pregunta abierta: el formulario de Sara</text><text x="506" y="375" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">pide sexo (masculino, femenino, otro). ¿El</text><text x="506" y="396" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">backend lo usa para algo? Si no, quítalo:</text><text x="506" y="417" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">con menores de edad se piden los datos</text><text x="506" y="438" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">mínimos (Ley 1581 de 2012). Y nunca se usa</text><text x="506" y="459" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">para elegir colores.</text><circle cx="483" cy="491" r="4" fill="#6B7177" stroke="#6B7177" stroke-width="1.5"/><text x="506" y="496" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">La contraseña va al final: primero se gana</text><text x="506" y="517" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">el interés, después se pide el esfuerzo.</text></svg>