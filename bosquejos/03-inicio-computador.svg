<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 760" width="1320" height="760" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1320" height="760" fill="#F7F7F5"/><text x="40" y="50" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#2B2F33" text-anchor="start">Inicio (computador)</text><text x="40" y="80" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#6B7177" text-anchor="start">Variante A en 1280 px</text><text x="40" y="104" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7177" text-anchor="start">El mismo contenido del celular, en dos columnas.</text><rect x="40" y="140" width="793.6" height="496.0" rx="18" fill="#FFFFFF" stroke="#8E949A" stroke-width="2.5"/><rect x="40" y="140" width="150" height="496.0" rx="18" fill="#ECEEF0" stroke="#B9BEC4" stroke-width="1.5"/><text x="60" y="176" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2B2F33" text-anchor="start">logo</text><rect x="52" y="200" width="126" height="32" rx="10" fill="#FFFFFF" stroke="#B9BEC4" stroke-width="1.5"/><text x="66" y="221" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2B2F33" text-anchor="start">Inicio</text><rect x="52" y="240" width="126" height="32" rx="10" fill="#ECEEF0" stroke="#ECEEF0" stroke-width="1.5"/><text x="66" y="261" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7177" text-anchor="start">Mis comidas</text><rect x="52" y="280" width="126" height="32" rx="10" fill="#ECEEF0" stroke="#ECEEF0" stroke-width="1.5"/><text x="66" y="301" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7177" text-anchor="start">Registrar</text><rect x="52" y="320" width="126" height="32" rx="10" fill="#ECEEF0" stroke="#ECEEF0" stroke-width="1.5"/><text x="66" y="341" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7177" text-anchor="start">Progreso</text><rect x="52" y="360" width="126" height="32" rx="10" fill="#ECEEF0" stroke="#ECEEF0" stroke-width="1.5"/><text x="66" y="381" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7177" text-anchor="start">Avatar</text><circle cx="190" cy="200" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="190" y="205" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="220" y="190" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B2F33" text-anchor="start">Hola, Ana</text><rect x="220" y="212" width="430" height="380" rx="20" fill="#ECEEF0" stroke="#B9BEC4" stroke-width="1.5"/><text x="240" y="240" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B2F33" text-anchor="start">Tu canasta de hoy</text><path d="M260 380.0 C260 305.0 320.0 260.0 402.5 290 C395.0 372.5 335.0 432.5 260 380.0 Z" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><polygon points="540.0,270.0 519.4,311.7 473.4,318.4 506.7,350.8 498.9,396.6 540.0,375.0 581.1,396.6 573.3,350.8 606.6,318.4 560.6,311.7" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><path d="M290 440 L400 440 L375 480 L400 520 L290 520 Z" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><line x1="290" y1="440" x2="290" y2="560" stroke="#2B2F33" stroke-width="2"/><circle cx="540" cy="500" r="55" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><circle cx="523.5" cy="491.75" r="4.4" fill="#6B7177" stroke="none" stroke-width="1.5"/><circle cx="556.5" cy="491.75" r="4.4" fill="#6B7177" stroke="none" stroke-width="1.5"/><path d="M520.75 513.75 Q540 530.25 559.25 513.75" fill="none" stroke="#6B7177" stroke-width="2"/><rect x="214" y="206" width="442" height="392" rx="18" fill="none" stroke="#E0A100" stroke-width="2.5" stroke-dasharray="7 5"/><rect x="606" y="194" width="50" height="22" rx="11" fill="#E0A100" stroke="#E0A100" stroke-width="1.5"/><text x="631" y="209" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Wow</text><circle cx="226" cy="208" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="226" y="213" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><rect x="670" y="212" width="152" height="120" rx="18" fill="#ECEEF0" stroke="#B9BEC4" stroke-width="1.5"/><text x="685" y="240" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2B2F33" text-anchor="start">¿Cómo llegas hoy?</text><rect x="670" y="346" width="152" height="110" rx="18" fill="#ECEEF0" stroke="#B9BEC4" stroke-width="1.5"/><text x="685" y="374" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2B2F33" text-anchor="start">Próxima misión</text><rect x="670" y="470" width="152" height="122" rx="18" fill="#ECEEF0" stroke="#B9BEC4" stroke-width="1.5"/><text x="685" y="498" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2B2F33" text-anchor="start">Racha y nivel</text><circle cx="822" cy="212" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="822" y="217" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="880" y="160" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B2F33" text-anchor="start">Qué cambia en 1280 px</text><circle cx="893" cy="191" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="893" y="196" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="916" y="196" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">La barra inferior se vuelve menú lateral.</text><text x="916" y="217" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">Es el mismo HTML (ya está en</text><text x="916" y="238" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">componentes.css).</text><circle cx="893" cy="270" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="893" y="275" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="916" y="275" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">La canasta crece y queda a la izquierda,</text><text x="916" y="296" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">donde empieza la lectura.</text><circle cx="893" cy="328" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="893" y="333" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="916" y="333" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">Lo que en celular iba arriba y abajo, aquí</text><text x="916" y="354" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">va en una columna a la derecha.</text><circle cx="893" cy="386" r="4" fill="#6B7177" stroke="#6B7177" stroke-width="1.5"/><text x="916" y="391" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">Diseña siempre las dos medidas, pero</text><text x="916" y="412" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">piensa primero el celular: si cabe ahí,</text><text x="916" y="433" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">cabe en todo.</text></svg>