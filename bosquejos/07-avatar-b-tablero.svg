F" text-anchor="middle">Progreso</text><circle cx="378" cy="908" r="9" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="378" y="936" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Avatar</text><circle cx="235" cy="890" r="34" fill="#FFFFFF" stroke="#5F656B" stroke-width="3"/><text x="235" y="895" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#2B2F33" text-anchor="middle">Cámara</text><text x="470" y="160" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B2F33" text-anchor="start">Qué hace cada parte</text><circle cx="483" cy="191" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="483" y="196" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="506" y="196" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">Avatar pequeño y tu nivel. Tocarlo abre el</text><text x="506" y="217" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">armario completo.</text><circle cx="483" cy="249" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="483" y="254" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="506" y="254" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">Las misiones como formas grandes, igual</text><text x="506" y="275" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">que la canasta de Inicio: misma gramática</text><text x="506" y="296" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">visual en toda la app. Wow: al cumplirse,</text><text x="506" y="317" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">la forma se llena y gira.</text><circle cx="483" cy="349" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="483" y="354" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="506" y="354" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">Un adelanto del armario: lo que ya tienes</text><text x="506" y="375" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">y lo que viene, con el nivel que falta.</text><circle cx="483" cy="407" r="4" fill="#6B7177" stroke="#6B7177" stroke-width="1.5"/><text x="506" y="412" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">A presume el avatar; B empuja a cumplir</text><text x="506" y="433" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">misiones. Tú dijiste que esta pantalla es</text><text x="506" y="454" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">'donde estarán las misiones': B lo toma</text><text x="506" y="475" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">literal.</text></svg>