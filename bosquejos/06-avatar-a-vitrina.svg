troke-width="1.5"/><text x="395" y="243" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Wow</text><circle cx="66" cy="242" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="66" y="247" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="64" y="544" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2B2F33" text-anchor="start">60 XP para el nivel 3</text><rect x="64" y="554" width="342" height="10" rx="5" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><rect x="64" y="580" width="342" height="44" rx="22" fill="#ECEEF0" stroke="#B9BEC4" stroke-width="1.5"/><rect x="68" y="584" width="167" height="36" rx="18" fill="#FFFFFF" stroke="#B9BEC4" stroke-width="1.5"/><text x="151" y="607" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2B2F33" text-anchor="middle">Misiones</text><text x="320" y="607" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7177" text-anchor="middle">Armario</text><circle cx="412" cy="580" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="412" y="585" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><rect x="64" y="640" width="342" height="64" rx="18" fill="#ECEEF0" stroke="#B9BEC4" stroke-width="1.5"/><text x="84" y="670" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B2F33" text-anchor="start">Registra una fruta</text><text x="84" y="690" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7177" text-anchor="start">+10 XP</text><polygon points="370.0,650.0 363.5,663.1 349.1,665.2 359.5,675.4 357.1,689.8 370.0,683.0 382.9,689.8 380.5,675.4 390.9,665.2 376.5,663.1" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><rect x="64" y="716" width="342" height="64" rx="18" fill="#FFFFFF" stroke="#B9BEC4" stroke-width="1.5"/><text x="84" y="746" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">Registra 3 comidas</text><text x="84" y="766" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7177" text-anchor="start">+10 XP</text><rect x="64" y="792" width="342" height="64" rx="18" fill="#FFFFFF" stroke="#B9BEC4" stroke-width="1.5"/><text x="84" y="822" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">Haz tu check-in de ánimo</text><text x="84" y="842" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7177" text-anchor="start">+10 XP</text><circle cx="412" cy="640" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="412" y="645" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><rect x="56" y="884" width="358" height="68" rx="34" fill="#5F656B" stroke="#5F656B" stroke-width="1.5"/><circle cx="92" cy="908" r="9" fill="#9AA0A6" stroke="none" stroke-width="1.5"/><text x="92" y="936" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">Inicio</text><circle cx="160" cy="908" r="9" fill="#9AA0A6" stroke="none" stroke-width="1.5"/><text x="160" y="936" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">Mis comidas</text><circle cx="310" cy="908" r="9" fill="#9AA0A6" stroke="none" stroke-width="1.5"/><text x="310" y="936" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">Progreso</text><circle cx="378" cy="908" r="9" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="378" y="936" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Avatar</text><circle cx="235" cy="890" r="34" fill="#FFFFFF" stroke="#5F656B" stroke-width="3"/><text x="235" y="895" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#2B2F33" text-anchor="middle">Cámara</text><text x="470" y="160" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B2F33" text-anchor="start">Qué hace cada parte</text><circle cx="483" cy="191" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="483" y="196" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="506" y="196" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">El avatar por capas de Laura (base, ropa,</text><text x="506" y="217" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">accesorio) con la cara de tu ánimo. Wow:</text><text x="506" y="238" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">al ponerte algo nuevo, el avatar da un</text><text x="506" y="259" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">saltico.</text><circle cx="483" cy="291" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="483" y="296" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="506" y="296" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">Pestañas: Misiones | Armario. El armario</text><text x="506" y="317" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">muestra ropa y accesorios; lo bloqueado</text><text x="506" y="338" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">lleva candado y 'Nivel 8'.</text><circle cx="483" cy="370" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="483" y="375" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="506" y="375" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">Las tres misiones diarias del backend. La</text><text x="506" y="396" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">cumplida lleva su calcomanía.</text><circle cx="483" cy="428" r="4" fill="#6B7177" stroke="#6B7177" stroke-width="1.5"/><text x="506" y="433" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">Datos: GET /avatar, POST /avatar/equipar y</text><text x="506" y="454" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">/quitar, y misiones de GET /progreso. Si</text><text x="506" y="475" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">las imágenes de Laura no llegan, el</text><text x="506" y="496" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">backend tiene el avatar DiceBear de</text><text x="506" y="517" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">respaldo.</text></svg>