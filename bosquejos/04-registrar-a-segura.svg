EC4" stroke-width="1.5" stroke-dasharray="5 5"/><text x="120" y="606" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7177" text-anchor="start">Lumea cree que es</text><text x="120" y="652" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#2B2F33" text-anchor="start">Banano</text><rect x="120" y="668" width="120" height="8" rx="4" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><text x="252" y="677" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7177" text-anchor="start">Segura al 94 %</text><text x="120" y="720" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B2F33" text-anchor="start">89 kcal  por cada 100 g</text><text x="120" y="750" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7177" text-anchor="start">Su potasio ayuda a tus músculos.</text><rect x="120" y="778" width="190" height="48" rx="24.0" fill="#5F656B" stroke="#5F656B" stroke-width="1.5"/><text x="215.0" y="807.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Sí, es esto  +10 XP</text><text x="320" y="808" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7177" text-anchor="start">No, es otra</text><rect x="48" y="570" width="374" height="300" rx="18" fill="none" stroke="#E0A100" stroke-width="2.5" stroke-dasharray="7 5"/><rect x="372" y="558" width="50" height="22" rx="11" fill="#E0A100" stroke="#E0A100" stroke-width="1.5"/><text x="397" y="573" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Wow</text><text x="470" y="160" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B2F33" text-anchor="start">Qué hace cada parte</text><circle cx="483" cy="191" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="483" y="196" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="506" y="196" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">Visor grande arriba; la foto ocupa lo que</text><text x="506" y="217" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">más se mira.</text><circle cx="483" cy="249" r="4" fill="#6B7177" stroke="#6B7177" stroke-width="1.5"/><text x="506" y="254" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">La etiqueta sube como hoja desde abajo y</text><text x="506" y="275" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">queda al alcance del pulgar. En computador</text><text x="506" y="296" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">va al lado del visor (ya está hecho).</text><circle cx="483" cy="328" r="4" fill="#6B7177" stroke="#6B7177" stroke-width="1.5"/><text x="506" y="333" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">Wow: la etiqueta entra colgando y se</text><text x="506" y="354" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">balancea una sola vez. Al confirmar, salta</text><text x="506" y="375" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">la calcomanía de XP.</text><circle cx="483" cy="407" r="4" fill="#6B7177" stroke="#6B7177" stroke-width="1.5"/><text x="506" y="412" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">Si el alimento tiene sellos, van entre el</text><text x="506" y="433" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">nombre y las calorías, en negro como dice</text><text x="506" y="454" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">la norma.</text><circle cx="483" cy="486" r="4" fill="#6B7177" stroke="#6B7177" stroke-width="1.5"/><text x="506" y="491" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">Datos: POST /predecir y POST</text><text x="506" y="512" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">/confirmar-alimento (api.js).</text><rect x="56" y="884" width="358" height="68" rx="34" fill="#5F656B" stroke="#5F656B" stroke-width="1.5"/><circle cx="92" cy="908" r="9" fill="#9AA0A6" stroke="none" stroke-width="1.5"/><text x="92" y="936" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">Inicio</text><circle cx="160" cy="908" r="9" fill="#9AA0A6" stroke="none" stroke-width="1.5"/><text x="160" y="936" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">Mis comidas</text><circle cx="310" cy="908" r="9" fill="#9AA0A6" stroke="none" stroke-width="1.5"/><text x="310" y="936" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">Progreso</text><circle cx="378" cy="908" r="9" fill="#9AA0A6" stroke="none" stroke-width="1.5"/><text x="378" y="936" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">Avatar</text><circle cx="235" cy="890" r="34" fill="#FFFFFF" stroke="#5F656B" stroke-width="3"/><text x="235" y="895" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#2B2F33" text-anchor="middle">Cámara</text></svg>