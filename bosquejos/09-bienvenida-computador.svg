<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 680" width="1320" height="680" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1320" height="680" fill="#F7F7F5"/><text x="40" y="50" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#2B2F33" text-anchor="start">Bienvenida (computador)</text><text x="40" y="80" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#6B7177" text-anchor="start">index.html de Sara, con nueva piel</text><text x="40" y="104" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7177" text-anchor="start">Lo primero que ve el jurado.</text><rect x="40" y="140" width="793.6" height="496.0" rx="18" fill="#FFFFFF" stroke="#8E949A" stroke-width="2.5"/><rect x="64" y="162" width="90" height="26" rx="8" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><text x="109" y="180" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2B2F33" text-anchor="middle">logo</text><text x="200" y="180" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7177" text-anchor="start">Conócenos</text><text x="290" y="180" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7177" text-anchor="start">Guía</text><rect x="603.6" y="158" width="90" height="34" rx="17.0" fill="#FFFFFF" stroke="#5F656B" stroke-width="1.5"/><text x="648.6" y="180.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2B2F33" text-anchor="middle">Entrar</text><rect x="703.6" y="158" width="110" height="34" rx="17.0" fill="#5F656B" stroke="#5F656B" stroke-width="1.5"/><text x="758.6" y="180.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Crear cuenta</text><text x="80" y="280" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7177" text-anchor="start">Tu titular aquí:</text><text x="80" y="316" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B2F33" text-anchor="start">Una frase que diga qué hace</text><text x="80" y="346" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B2F33" text-anchor="start">Lumea y por qué no prohíbe</text><rect x="80" y="366" width="340" height="12" rx="6" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><rect x="80" y="386" width="280" height="12" rx="6" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><rect x="80" y="420" width="150" height="48" rx="24.0" fill="#5F656B" stroke="#5F656B" stroke-width="1.5"/><text x="155.0" y="449.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Crear cuenta</text><rect x="244" y="420" width="150" height="48" rx="24.0" fill="#FFFFFF" stroke="#5F656B" stroke-width="1.5"/><text x="319.0" y="449.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2B2F33" text-anchor="middle">Ya tengo cuenta</text><circle cx="70" cy="260" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="70" y="265" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><rect x="520" y="220" width="240" height="300" rx="30" fill="#5F656B" stroke="#5F656B" stroke-width="1.5"/><text x="640" y="260" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">foto de comida real</text><rect x="560" y="340" width="200" height="150" rx="18" fill="#FFFFFF" stroke="#B9BEC4" stroke-width="1.5"/><circle cx="580" cy="362" r="6" fill="#DADDE1" stroke="#B9BEC4" stroke-width="1.5"/><text x="600" y="410" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#2B2F33" text-anchor="start">Banano</text><text x="600" y="440" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2B2F33" text-anchor="start">89 kcal</text><rect x="514" y="214" width="272" height="312" rx="18" fill="none" stroke="#E0A100" stroke-width="2.5" stroke-dasharray="7 5"/><rect x="736" y="202" width="50" height="22" rx="11" fill="#E0A100" stroke="#E0A100" stroke-width="1.5"/><text x="761" y="217" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Wow</text><circle cx="510" cy="210" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="510" y="215" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><rect x="80" y="550" width="230" height="70" rx="16" fill="#ECEEF0" stroke="#B9BEC4" stroke-width="1.5"/><text x="96" y="590" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2B2F33" text-anchor="start">Captura y reconoce</text><rect x="330" y="550" width="230" height="70" rx="16" fill="#ECEEF0" stroke="#B9BEC4" stroke-width="1.5"/><text x="346" y="590" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2B2F33" text-anchor="start">Información nutricional</text><rect x="580" y="550" width="230" height="70" rx="16" fill="#ECEEF0" stroke="#B9BEC4" stroke-width="1.5"/><text x="596" y="590" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2B2F33" text-anchor="start">Enfoque educativo</text><circle cx="70" cy="545" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="70" y="550" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="880" y="160" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B2F33" text-anchor="start">Qué hace cada parte</text><circle cx="893" cy="191" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="893" y="196" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="916" y="196" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">El titular es tuyo: una frase que diga qué</text><text x="916" y="217" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">hace Lumea sin prometer milagros. Botón</text><text x="916" y="238" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">principal: Crear cuenta.</text><circle cx="893" cy="270" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="893" y="275" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="916" y="275" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">Wow: en vez de la imagen de hojas, una</text><text x="916" y="296" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">foto real de comida y la etiqueta de plaza</text><text x="916" y="317" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">entrando colgada. Muestra el producto en</text><text x="916" y="338" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">dos segundos.</text><circle cx="893" cy="370" r="13" fill="#2B2F33" stroke="#2B2F33" stroke-width="1.5"/><text x="893" y="375" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="916" y="375" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">Las tres tarjetas de Sara, con sus textos.</text><circle cx="893" cy="407" r="4" fill="#6B7177" stroke="#6B7177" stroke-width="1.5"/><text x="916" y="412" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">En celular todo va en una columna:</text><text x="916" y="433" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">titular, botón, la foto con la etiqueta y</text><text x="916" y="454" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2B2F33" text-anchor="start">las tarjetas.</text></svg>