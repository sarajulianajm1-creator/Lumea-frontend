<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- Paleta, modo y piel (?piel=sara muestra el original) -->
<script src="tema.js"></script>
<title>LUMEA | Bienestar y Nutrición Consciente</title>
<!-- Favicon -->
<link rel="icon" type="image/png" href="lumeaaa.png">
<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
<!-- Bootstrap 5.3.3 CSS (copia local en vendor/: funciona sin internet) -->
<link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
<!-- Hoja de Estilos Unificada -->
<link rel="stylesheet" href="estilos/tokens.css">
<link rel="stylesheet" href="estilos/paletas.css">
<link rel="stylesheet" href="style.css" />
<!-- Piel de Lumea sobre el diseño de Sara (no cambia style.css) -->
<link rel="stylesheet" href="estilos/puente-sara.css">
</head>

<body>

<!-- Barra de Navegación Global -->
<header>
        <div class="container fixed-bottom d-flex justify-content-center mb-4">
        <nav class="custom-navbar d-flex align-items-center justify-content-around px-3 py-2 shadow-lg" aria-label="Principal">
            <!-- Los cinco destinos de la app (navegación B, 4 oct 2026) -->
            <a href="index-ingresado.html" class="nav-item-custom text-center text-decoration-none" aria-current="page">
                <i class="bi bi-house-door-fill fs-4" aria-hidden="true"></i>
                <span>Inicio</span>
            </a>

            <a href="mis-registros.html" class="nav-item-custom text-center text-decoration-none">
                <i class="bi bi-basket-fill fs-4" aria-hidden="true"></i>
                <span>Mis registros</span>
            </a>

            <a href="alimentos.html" class="nav-item-custom text-center text-decoration-none">
                <i class="bi bi-camera-fill fs-4" aria-hidden="true"></i>
                <span>Registrar</span>
            </a>

            <a href="progreso.html" class="nav-item-custom text-center text-decoration-none">
                <i class="bi bi-graph-up-arrow fs-4" aria-hidden="true"></i>
                <span>Progreso</span>
            </a>

            <a href="avatar.html" class="nav-item-custom text-center text-decoration-none">
                <i class="bi bi-person-fill fs-4" aria-hidden="true"></i>
                <span>Avatar</span>
            </a>
        </nav>
        </div>
    
<!-- Fila Superior: Perfil y Saludo -->
    
    <div class="lumea-dashboard-screen">
        <div class="lumea-dashboard-card">
        <div class="user-header-content d-flex align-items-center">
            <div class="profile-avatar-container me-3">
                <img id="user-avatar-img" src="lumeaaa.png" alt="Avatar">
            </div>
            <div>
                <h1 id="welcome-message" class="mb-0">¡Bienvenido/a a LUMEA!</h1>   <!-- el saludo es el h1 de la página (antes un h5); style.css lo pinta por #welcome-message, así que se ve igual -->
                <span id="user-name">Cargando perfil...</span>
            </div>
        </div>

<!-- Fila Central: Nivel y Barra de XP -->
        <div class="gamification-section">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span id="user-nivel" class="nivel-badge">Nivel --</span>
                <small id="xp-text" class="text-muted fw-semibold" style="font-size: 0.75rem;">Cargando XP...</small>
            </div>
    
            <div class="progress mb-1">
                <div id="xp-bar" class="progress-bar" role="progressbar" style="width: 0%;"></div>
            </div>
        </div>

<!-- Fila Inferior: Racha y Meta del día -->
        <div class="stats-footer d-flex justify-content-between align-items-center">
            <div class="racha-badge shadow-sm">
                🔥 <span id="user-racha">Calculando racha...</span>
            </div>
            <div class="meta-badge shadow-sm">
                🎯 <span id="meta-texto">Meta: 0/0 XP</span>
            </div>
        </div>

        </div>
    </div>



</header>

  <!-- Conexión con el backend: api.js (dirección y llamadas) + indexx.js (llena esta pantalla) -->
  <script src="api.js"></script>
  <script src="indexx.js"></script>
</body>
</html>
